name: Publish (npm)

# Twzrd package release is manual: merging to the fork's release branch cannot
# publish these packages without an operator dispatch. The main branch has its
# separate @blockrun/clawrouter release workflow.

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Publish the exact core and MPP versions shown in the run log
        required: true
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/claude/twzrd-fork' && inputs.confirm_publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # required for npm --provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          registry-url: "https://registry.npmjs.org"

      - name: Resolve Twzrd package versions
        id: versions
        shell: bash
        run: |
          ROOT_NAME=$(node -p "require('./package.json').name")
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if ROOT_REGISTRY_RESULT=$(npm view "$ROOT_NAME@$ROOT_VERSION" version 2>&1); then
            ROOT_PUBLISHED=true
          elif grep -q 'E404' <<<"$ROOT_REGISTRY_RESULT"; then
            ROOT_PUBLISHED=false
          else
            echo "$ROOT_REGISTRY_RESULT" >&2
            exit 1
          fi
          MPP_NAME=$(node -p "require('./packages/clawrouter-mpp/package.json').name")
          MPP_VERSION=$(node -p "require('./packages/clawrouter-mpp/package.json').version")
          if MPP_REGISTRY_RESULT=$(npm view "$MPP_NAME@$MPP_VERSION" version 2>&1); then
            MPP_PUBLISHED=true
          elif grep -q 'E404' <<<"$MPP_REGISTRY_RESULT"; then
            MPP_PUBLISHED=false
          else
            echo "$MPP_REGISTRY_RESULT" >&2
            exit 1
          fi

          {
            echo "root_name=$ROOT_NAME"
            echo "root_version=$ROOT_VERSION"
            echo "publish_root=$([ "$ROOT_PUBLISHED" = false ] && echo true || echo false)"
            echo "mpp_name=$MPP_NAME"
            echo "mpp_version=$MPP_VERSION"
            echo "publish_mpp=$([ "$MPP_PUBLISHED" = false ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "$ROOT_NAME@$ROOT_VERSION: $( [ "$ROOT_PUBLISHED" = true ] && echo already-published || echo not-yet-published )"
          echo "$MPP_NAME@$MPP_VERSION: $( [ "$MPP_PUBLISHED" = true ] && echo already-published || echo not-yet-published )"

      - name: Install core dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build, typecheck, and test core
        run: |
          npx prettier --check .
          npm run lint
          npm run build
          npm run typecheck
          npm test
          node scripts/sync-brand-numbers.mjs --check

      - name: Install MPP package development dependencies
        working-directory: packages/clawrouter-mpp
        run: npm install --ignore-scripts --legacy-peer-deps --package-lock=false --no-audit --no-fund

      - name: Build, typecheck, and test MPP package
        working-directory: packages/clawrouter-mpp
        run: |
          npm run build
          npm run typecheck
          npm test

      # The root package must publish first because MPP declares it as a peer.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish core package
        if: steps.versions.outputs.publish_root == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip core package (already published)
        if: steps.versions.outputs.publish_root != 'true'
        run: echo "${{ steps.versions.outputs.root_name }}@${{ steps.versions.outputs.root_version }} is already published"

      - name: Publish MPP package
        if: steps.versions.outputs.publish_mpp == 'true'
        working-directory: packages/clawrouter-mpp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip MPP package (already published)
        if: steps.versions.outputs.publish_mpp != 'true'
        run: echo "${{ steps.versions.outputs.mpp_name }}@${{ steps.versions.outputs.mpp_version }} is already published"
