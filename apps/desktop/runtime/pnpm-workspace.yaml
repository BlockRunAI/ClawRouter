allowBuilds:
  "@deepseek-ai/dsh-subprocess-local": true
  "@google/genai": true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
packages:
  - "."
overrides:
  "@blockrun/clawrouter": 0.12.308
  # Mirrors the root package.json security pins. This runtime is a SEPARATE pnpm
  # install that electron-builder packages into the app, so the root `overrides`
  # never reach it — @polymarket/builder-relayer-client was still dragging
  # axios 0.27.2 in here long after v0.12.238 fixed it at the root.
  axios: ^1.20.0
  undici: ^8.12.3
  ws: ^8.21.2
  brace-expansion: ^5.0.12
  fast-uri: ^3.1.9
  ip-address: 10.7.4
  proxy-addr: ^2.0.8
  hono: 4.13.11
  "@hono/node-server": 2.1.3
  sharp: ^0.35.5
  follow-redirects: 1.16.2
  "@modelcontextprotocol/sdk": 1.32.0
  zod: ^4.6.6
  qs: 6.16.1
  body-parser: 2.4.0
  # Sole consumer is pi-coding-agent, which only calls minimatch(str, pattern,
  # {nocase}); v11 keeps that API (it drops makeRe/AST/debug).
  minimatch: 11.0.4
  # Hold fresh transitives to the versions the root lockfile already vetted, or to
  # releases at least 14 days old.
  viem: 2.57.13
  "@preact/signals-core": 1.14.4
minimumReleaseAgeExclude:
  - "@blockrun/clawrouter@0.12.308"
  - minimatch@11.0.4
